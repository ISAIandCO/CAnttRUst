name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.2
          cache: npm

      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run package:firefox
      - run: npm run check:reproducible
      - run: npm run build:self-hosted

      - name: Install pinned Firefox and geckodriver for browser tests
        shell: bash
        run: |
          curl --fail --location --retry 3 --max-time 180 -o "$RUNNER_TEMP/firefox.tar.xz" https://download-installer.cdn.mozilla.net/pub/firefox/releases/155.0.1/linux-x86_64/en-US/firefox-155.0.1.tar.xz
          curl --fail --location --retry 3 --max-time 180 -o "$RUNNER_TEMP/geckodriver.tar.gz" https://github.com/mozilla/geckodriver/releases/download/v0.36.0/geckodriver-v0.36.0-linux64.tar.gz
          cd "$RUNNER_TEMP"
          echo '642ab731354a5ca790b894d4556dfb5028c61d0c24eb10d10e10a111a69c89bf  firefox.tar.xz' | sha256sum --check
          echo '0bde38707eb0a686a20c6bd50f4adcc7d60d4f73c60eb83ee9e0db8f65823e04  geckodriver.tar.gz' | sha256sum --check
          tar -xf firefox.tar.xz
          tar -xf geckodriver.tar.gz

      - name: Real Firefox TLS, subresource, cache and UI checks
        run: npm run test:firefox
        env:
          FIREFOX_BINARY: ${{ runner.temp }}/firefox/firefox
          GECKODRIVER: ${{ runner.temp }}/geckodriver
          # Disposable localhost-only browser profile; supports runners without user namespaces.
          MOZ_DISABLE_CONTENT_SANDBOX: "1"
          MOZ_DISABLE_RDD_SANDBOX: "1"
          MOZ_DISABLE_GMP_SANDBOX: "1"

      - name: Upload unsigned review package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: firefox-review-package
          path: artifacts/*.zip
          if-no-files-found: error
          retention-days: 14
