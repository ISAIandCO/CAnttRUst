name: Monitor security policy

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-policy-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    steps:
      - name: Checkout accepted policy
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.2
          cache: npm

      - name: Check CT and root sources independently
        id: policy
        run: node scripts/prepare-policy-update.mjs

      - name: Install build dependencies
        if: steps.policy.outputs.changed == 'true'
        run: npm ci
      - name: Verify candidate
        if: steps.policy.outputs.changed == 'true'
        run: npm run package:firefox && npm run check:reproducible

      - name: Prepare review PR
        if: steps.policy.outputs.changed == 'true' || steps.policy.outputs.errors == 'false'
        id: pr
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          branch: bot/security-policy
          base: main
          title: "Обновить CT-логи и отпечатки российских CA"
          commit-message: "Update reviewed security policy candidate and patch version"
          body-path: artifacts/policy-update.md
          add-paths: |
            src/policy/
            package.json
            package-lock.json
            manifest.firefox.json

      - name: Run CI explicitly for the bot branch
        if: steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref bot/security-policy

      - name: Report unavailable or invalid sources
        if: always() && steps.policy.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_ERRORS: ${{ steps.policy.outputs.errors }}
        shell: bash
        run: |
          title="Не удалось проверить источники политики CAnttRUst"
          issue="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number,title --jq '[.[] | select(.title == "Не удалось проверить источники политики CAnttRUst")][0].number // empty')"
          if [ "$HAS_ERRORS" = true ]; then
            if [ -n "$issue" ]; then
              gh issue edit "$issue" --repo "$GITHUB_REPOSITORY" --body-file artifacts/policy-errors.md
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file artifacts/policy-errors.md
            fi
          elif [ -n "$issue" ]; then
            gh issue close "$issue" --repo "$GITHUB_REPOSITORY"
          fi

      - name: Keep check report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-policy-report
          path: artifacts/*
          if-no-files-found: warn
          retention-days: 30

      - name: Mark incomplete source check
        if: steps.policy.outputs.errors == 'true'
        run: exit 1
