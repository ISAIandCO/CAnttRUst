<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CAnttRUst</title><link rel="stylesheet" href="popup.css"></head>
<body><main><h1>CAnttRUst</h1><p id="summary" role="status">Загрузка…</p>
<form id="exceptions"><div id="selection" hidden><label class="host-choice"><input id="select-all" type="checkbox"> Выбрать все заблокированные домены</label></div>
<div id="requests"></div>
<div id="exception" hidden><p>По умолчанию домены разрешаются постоянно. В приватном окне — до закрытия приватных вкладок.</p>
<details><summary>Параметры исключений</summary>
<label>Обойти<select id="scope"><option value="all">Зону и CT</option><option value="zone">Только ограничение зоны</option><option value="ct">Только проверку CT</option></select></label>
<label>Срок<select id="duration"><option value="permanent">Постоянно (приватно — только сессия)</option><option value="hour">На час</option><option value="session">До перезапуска расширения / браузера</option></select></label></details>
<button id="allow" type="submit" disabled>Выберите домены</button></div></form>
<p id="error" role="alert"></p><button id="options" type="button">Настройки и исключения</button></main><script src="popup.js"></script></body></html>
